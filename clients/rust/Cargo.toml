[package]
name = "dust-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Client for dust's gRPC control API (dust-headless)"

# Not part of dust's nightly workspace: this crate builds on stable Rust and contains only the
# protocol definition and its own code.
[workspace]

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.3"

[dev-dependencies]
sha1 = "0.10"
